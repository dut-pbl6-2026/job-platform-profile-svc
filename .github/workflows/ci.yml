name: ci
on: { push: { branches: [main] }, pull_request: { branches: [main] } }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # Test database for API integration tests (ProfileApiTests creates it
      # via the maintenance db; the app itself runs EF MigrateAsync on boot).
      # ef-check never opens a connection — any well-formed string works there.
      TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
      DATABASE_URL_PROFILE: Host=localhost;Port=5432;Database=job_platform_profile;Username=postgres;Password=postgres
      PROFILE_ENCRYPTION_KEY: ci-profile-encryption-key-32-chars!!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ProfileService.sln --warnaserror
      - run: dotnet format --verify-no-changes ProfileService.sln
      - run: dotnet test ProfileService.sln
      - run: dotnet tool install --global dotnet-ef
      - run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - run: dotnet ef migrations has-pending-model-changes --project src/Profile.Infrastructure --startup-project src/Profile.Api
