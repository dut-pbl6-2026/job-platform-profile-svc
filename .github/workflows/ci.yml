name: ci
on: { push: { branches: [main] }, pull_request: { branches: [main] } }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # Test database for API integration tests (ProfileApiTests creates it
      # via the maintenance db; the app itself runs EF MigrateAsync on boot).
      # ef-check never opens a connection — any well-formed string works there.
      TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
      DATABASE_URL_PROFILE: Host=localhost;Port=5432;Database=job_platform_profile;Username=postgres;Password=postgres
      PROFILE_ENCRYPTION_KEY: ci-profile-encryption-key-32-chars!!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ProfileService.sln --warnaserror
      - run: dotnet format --verify-no-changes ProfileService.sln
      - run: dotnet test ProfileService.sln
      - run: dotnet tool install --global dotnet-ef
      - run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - run: dotnet ef migrations has-pending-model-changes --project src/Profile.Infrastructure --startup-project src/Profile.Api

  # PBL6-50: optional SonarCloud analysis. Runs its steps only when the SONAR_TOKEN
  # secret exists (empty on fork PRs / Dependabot / unset secret) so it never blocks CI.
  sonarcloud:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
      DATABASE_URL_PROFILE: Host=localhost;Port=5432;Database=job_platform_profile;Username=postgres;Password=postgres
      PROFILE_ENCRYPTION_KEY: ci-profile-encryption-key-32-chars!!
    steps:
      - name: SonarCloud skipped (SONAR_TOKEN not available)
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN not set - skipping SonarCloud analysis"
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        if: env.SONAR_TOKEN != ''
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        if: env.SONAR_TOKEN != ''
        with: { distribution: temurin, java-version: "17" }
      - name: Install SonarScanner
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner --version 11.2.1
      - name: SonarCloud begin
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet-sonarscanner begin
          /k:"${{ vars.SONAR_PROJECT_KEY || 'dut-pbl6-2026_job-platform-profile-svc' }}"
          /o:"${{ vars.SONAR_ORGANIZATION || 'dut-pbl6-2026' }}"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/Migrations/**"
      - name: Build
        if: env.SONAR_TOKEN != ''
        run: dotnet build ProfileService.sln --no-incremental
      - name: Test with coverage
        if: env.SONAR_TOKEN != ''
        run: dotnet test ProfileService.sln --no-build --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      - name: SonarCloud end
        if: env.SONAR_TOKEN != ''
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
